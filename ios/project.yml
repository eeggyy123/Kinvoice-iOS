name: KinVoice
options:
  bundleIdPrefix: com.kinvoice
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  KinVoice:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
    resources:
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kinvoice.familyarchive
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: []
